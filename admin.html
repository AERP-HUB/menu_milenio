<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#150A07">
  <title>Panel · Café Milenio</title>
  <style>
    /* Panel de administración: tema oscuro fijo, café y dorado (mismas variables que la tienda) */
    :root{--bg:#150A07;--surf-rgb:34 17 12;--gold-rgb:217 162 63;--ink:#F6EBDD;--mute:#C2AFA3;--line:rgba(255,235,210,.14);--goldt:#E8B652;--bean:#C98B5E;--cherry:#F0666B;--leaf:#8FC46E;color-scheme:dark}
    html{-webkit-text-size-adjust:100%}
    body{background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background-image:radial-gradient(60rem 30rem at 90% -10%,rgba(217,162,63,.12),transparent),radial-gradient(40rem 30rem at -10% 100%,rgba(179,38,43,.12),transparent);background-attachment:fixed}
    [hidden]{display:none!important}
    :focus-visible{outline:3px solid #E8B652;outline-offset:2px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.75rem;padding:.5rem 1rem;border-radius:.8rem;font-weight:700;font-size:.9rem;border:1px solid transparent;cursor:pointer;transition:filter .15s,transform .15s,background .15s;user-select:none}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn-gold{background:linear-gradient(135deg,#D9A23F,#FF8A1F);color:#24100B}
    .btn-gold:not(:disabled):hover{filter:brightness(1.07);transform:translateY(-1px)}
    .btn-line{border-color:var(--line);background:rgb(var(--surf-rgb));color:var(--ink)}
    .btn-line:not(:disabled):hover{border-color:#D9A23F}
    .btn-danger{border-color:rgba(240,102,107,.5);color:var(--cherry);background:transparent}
    .btn-danger:not(:disabled):hover{background:rgba(240,102,107,.12)}
    .in{width:100%;min-height:2.75rem;border-radius:.75rem;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);padding:.55rem .8rem;font-size:1rem}
    .in::placeholder{color:#8d7b70}
    .in:focus{border-color:#D9A23F;outline:2px solid rgba(217,162,63,.45);outline-offset:0}
    .in[aria-invalid=true]{border-color:var(--cherry)}
    select.in{appearance:auto}
    .card{background:rgb(var(--surf-rgb) / .92);border:1px solid var(--line);border-radius:1.1rem}
    .tab{min-height:2.9rem;padding:.55rem 1rem;border-radius:.8rem;font-weight:700;font-size:.92rem;border:1px solid transparent;color:var(--mute);white-space:nowrap;cursor:pointer}
    .tab[aria-selected=true]{background:rgba(217,162,63,.16);border-color:rgba(217,162,63,.55);color:var(--goldt)}
    .tab:not([aria-selected=true]):hover{color:var(--ink);border-color:var(--line)}
    .chip{min-height:2.75rem;padding:.35rem .85rem;border-radius:99px;border:1px solid var(--line);font-size:.82rem;font-weight:700;color:var(--mute);cursor:pointer;white-space:nowrap}
    .chip[aria-pressed=true]{background:#D9A23F;border-color:#D9A23F;color:#24100B}
    .pill{display:inline-flex;align-items:center;border-radius:99px;padding:.15rem .6rem;font-size:.72rem;font-weight:800;border:1px solid}
    .toast{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;width:max-content;max-width:calc(100vw - 2rem);padding:.7rem 1rem;border-radius:.9rem;background:#24100B;border:1px solid #D9A23F;color:#F6EBDD;font-weight:700;font-size:.9rem;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:tin .25s ease-out}
    .toast.err{border-color:#F0666B}
    @keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
    .bar{height:.5rem;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
    .bar>i{display:block;height:100%;background:linear-gradient(90deg,#D9A23F,#FF8A1F);transition:width .2s}
    .spin{width:1.1rem;height:1.1rem;border-radius:99px;border:2px solid rgba(36,16,11,.3);border-top-color:#24100B;animation:sp .7s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    /* columnas de la lista de pedidos (escritorio) */
    @media (min-width:768px){.ogrid{grid-template-columns:8rem 9rem minmax(0,1fr) minmax(0,1.5fr) 5.5rem 6.5rem 10rem}}
    @media (max-width:767px){.ogrid{grid-template-columns:1fr}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>

      if (!confirm('Se guardarán en Firestore los precios y datos iniciales de las 3 calidades (no se tocan los que ya existan). ¿Continuar?')) return;
      try { for (const d of DEFAULTS) if (!prodDocs[d.id]) await setDoc(doc(db, 'productos', d.id), { name: d.name, men: d.men, may: d.may, tueste: d.tueste, nivel: d.nivel, notas: d.notas, acidez: d.acidez, dulzor: d.dulzor, img: d.img, actualizado: serverTimestamp() }, { merge: true }); toast('Catálogo inicial cargado'); }
      catch (x) { toast('No se pudo cargar: ' + errMsg(x), true); }
    });
    // Imagen: se reduce en el navegador (máx. 1200 px, WebP) y se sube a Storage; la URL se guarda enseguida en Firestore
    async function shrink(file) {
      const url = URL.createObjectURL(file);
      try {
        const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('No se pudo leer la imagen.')); i.src = url; });
        const k = Math.min(1, 1200 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        let b = await new Promise(r => c.toBlob(r, 'image/webp', .88)); if (!b || b.type !== 'image/webp') b = await new Promise(r => c.toBlob(r, 'image/jpeg', .88));
        if (!b) throw new Error('No se pudo procesar la imagen.'); return b;
      } finally { URL.revokeObjectURL(url); }
    }
    $('#plist').addEventListener('change', async e => {
      const inp = e.target.closest('[data-file]'); if (!inp || !inp.files[0]) return; const id = inp.dataset.file, file = inp.files[0], d = DEFAULTS.find(x => x.id === id);
      const msg = $(`[data-imsg="${id}"]`), bar = $(`[data-bar="${id}"]`), fill = bar.firstElementChild; msg.className = 'text-xs mt-1 text-mute';
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { msg.textContent = 'Usa una imagen JPG, PNG o WebP.'; msg.className = 'text-xs mt-1 text-cherry'; inp.value = ''; return; }
      if (file.size > 15 * 1024 * 1024) { msg.textContent = 'La imagen pesa más de 15 MB.'; msg.className = 'text-xs mt-1 text-cherry'; inp.value = ''; return; }
      msg.textContent = 'Preparando imagen…'; bar.hidden = false; fill.style.width = '0';
      try {
        const blob = await shrink(file); if (blob.size > 2.8 * 1024 * 1024) throw new Error('La imagen sigue pesando demasiado. Usa una más pequeña.');
        const old = (prodDocs[id] || {}).img, path = `productos/${id}_${Date.now()}.${blob.type === 'image/webp' ? 'webp' : 'jpg'}`, r = ref(storage, path);
        const task = uploadBytesResumable(r, blob, { contentType: blob.type, cacheControl: 'public,max-age=31536000' });
        await new Promise((ok, no) => task.on('state_changed', s => { const p = s.totalBytes ? Math.round(100 * s.bytesTransferred / s.totalBytes) : 0; fill.style.width = p + '%'; msg.textContent = `Subiendo… ${p}%`; }, no, ok));
        const url = await getDownloadURL(r);
        await setDoc(doc(db, 'productos', id), { name: d.name, img: url, actualizado: serverTimestamp() }, { merge: true });
        if (safeUrl(old) && old.includes('/o/productos%2F')) { try { await deleteObject(ref(storage, old)); } catch (x) { } } // limpia la imagen anterior (si no se puede, no pasa nada)
        msg.textContent = 'Imagen actualizada en la tienda.'; msg.className = 'text-xs mt-1 text-leaf'; toast(`Imagen de ${d.name} actualizada`);
      } catch (x) { msg.textContent = 'No se pudo subir: ' + (x && x.message && !x.code ? x.message : errMsg(x)); msg.className = 'text-xs mt-1 text-cherry'; }
      finally { bar.hidden = true; inp.value = ''; }
    });

    /* ======================= c) RESEÑAS ======================= */
    function renderReviews() {
      const q = norm($('#rq').value), list = reviews.filter(r => !q || norm((r.nombre || '') + ' ' + (r.comentario || '') + ' ' + (r.producto || '')).includes(q));
      $('#rcount').textContent = reviews.length ? `${list.length} de ${reviews.length} reseñas` : 'Aún no hay reseñas.';
      const c = $('#c-res'); c.hidden = !reviews.length; c.textContent = reviews.length;
      $('#rlist').innerHTML = list.length ? list.map(r => { const s = Number.isInteger(r.estrellas) ? r.estrellas : 0, foto = safeUrl(r.fotoURL);
        return `<article class="card p-4 grid gap-2 content-start"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><b class="block break-words">${esc(r.nombre || '—')}</b><span class="text-xs text-mute">${esc(r.producto || '')} · ${fdate(r._t)}</span></div>
      <span class="text-goldt whitespace-nowrap" aria-label="${s} de 5 estrellas">${'★'.repeat(s)}<span class="text-mute">${'★'.repeat(5 - s)}</span></span></div>
      <p class="text-sm break-words whitespace-pre-line">${esc(r.comentario || '')}</p>
      ${foto ? `<a href="${esc(foto)}" target="_blank" rel="noopener noreferrer"><img src="${esc(foto)}" alt="Foto adjunta a la reseña de ${esc(r.nombre || '')}" loading="lazy" class="h-28 w-auto rounded-lg border border-line object-cover"></a>` : ''}
      <div><button type="button" class="btn btn-danger" data-del="${esc(r.id)}">Eliminar reseña</button></div></article>`; }).join('')
        : `<p class="card p-6 text-center text-mute md:col-span-2">${reviews.length ? 'Ninguna reseña coincide con la búsqueda.' : 'Cuando un cliente publique una reseña aparecerá aquí.'}</p>`;
    }
    $('#rq').addEventListener('input', renderReviews);
    $('#rlist').addEventListener('click', async e => {
      const b = e.target.closest('[data-del]'); if (!b) return; const r = reviews.find(x => x.id === b.dataset.del); if (!r) return;
      if (!confirm(`¿Eliminar la reseña de “${r.nombre || 'sin nombre'}”? Esta acción no se puede deshacer.`)) return;
      b.disabled = true;
      try { await deleteDoc(doc(db, 'resenas', r.id)); toast('Reseña eliminada'); if (safeUrl(r.fotoURL)) { try { await deleteObject(ref(storage, r.fotoURL)); } catch (x) { } } }
      catch (x) { toast('No se pudo eliminar: ' + errMsg(x), true); b.disabled = false; }
    });
  </script>
